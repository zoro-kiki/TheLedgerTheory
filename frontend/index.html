<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlockLoyalty - Web3 POS</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: sans-serif; margin: 0; padding: 0; }
        body { background: #f1f5f9; padding: 20px; color: #0f172a; }
        .container { max-width: 900px; margin: 0 auto; }
        .card { background: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #e2e8f0; }
        .btn { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 8px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; margin-top: 5px; }
        .logs { background: #0f172a; color: #38bdf8; padding: 15px; border-radius: 8px; font-family: monospace; height: 150px; overflow-y: auto; margin-top: 10px; }
    </style>
</head>
<body>
<div class="container">
    <div class="card" style="text-align: center; background: #1e3a8a; color: white;">
        <h2>BlockLoyalty - Web3 POS Terminal</h2>
        <button class="btn" id="connBtn" onclick="connect()" style="width: auto; background: #10b981; margin-top: 10px;">Connect MetaMask</button>
    </div>

    <div class="card">
        <h3>1. Customer Account Selection</h3>
        <label style="font-size: 13px; color: #64748b; font-weight: bold;">Select Quick Test Customer:</label>
        <select id="quickSelect" onchange="autoFillAddress()">
            <option value="0x70997970C51812dc3A010C7d01b50e0d17dc79C8">Customer A (Account #1 - 0x7099...79C8)</option>
            <option value="0x3C44CdDdB6a900fa2b585dd299e03d12FA4293BC">Customer B (Account #2 - 0x3C44...93BC)</option>
            <option value="0x90F79bf6EB2c4f870365E785982E1f101E93b906">Customer C (Account #3 - 0x90F7...b906)</option>
        </select>

        <label style="font-size: 13px; color: #64748b; font-weight: bold; margin-top: 10px; display: block;">Target Wallet Address:</label>
        <input type="text" id="targetAddr" value="0x70997970C51812dc3A010C7d01b50e0d17dc79C8">
        <button class="btn" onclick="checkBal()">Check Live Balance</button>
        <div id="balView" style="margin-top: 10px; font-weight: bold; color: #10b981;"></div>
    </div>

    <div class="card">
        <h3>2. Mint Rewards</h3>
        <input type="number" id="billAmt" placeholder="Enter Bill Amount (INR)">
        <button class="btn" onclick="reward()">Mint Tokens</button>
    </div>

    <div class="card">
        <h3>Console Output</h3>
        <div class="logs" id="logBox">Ready...</div>
    </div>
</div>

<script>
    const CONTRACT_ADDRESS = "0x5FbDB2315678afecb367f032d93F642f64180aa3";
    const CONTRACT_ABI = [
        "function balanceOf(address account) view returns (uint256)",
        "function rewardCustomer(address _customer, uint256 _points) returns (bool)"
    ];

    let provider, signer, contract;

    function autoFillAddress() {
        const select = document.getElementById('quickSelect');
        document.getElementById('targetAddr').value = select.value;
    }

    function log(msg) {
        const box = document.getElementById('logBox');
        box.innerHTML += `<br>[${new Date().toLocaleTimeString()}] ${msg}`;
        box.scrollTop = box.scrollHeight;
    }

    async function connect() {
        if (!window.ethereum) return alert("MetaMask missing!");
        provider = new ethers.BrowserProvider(window.ethereum);
        signer = await provider.getSigner();
        contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);
        const addr = await signer.getAddress();
        document.getElementById('connBtn').innerText = "Connected: " + addr.substring(0, 6) + "...";
        log("MetaMask Connected: " + addr);
    }

    async function checkBal() {
        if (!contract) return alert("Connect MetaMask first!");
        const addr = document.getElementById('targetAddr').value.trim();
        const bal = await contract.balanceOf(addr);
        document.getElementById('balView').innerText = "Balance: " + bal.toString() + " BLT";
        log("Balance Query: " + bal.toString() + " BLT");
    }

    async function reward() {
        if (!contract) return alert("Connect MetaMask first!");
        const addr = document.getElementById('targetAddr').value.trim();
        const bill = parseFloat(document.getElementById('billAmt').value) || 0;
        const pts = Math.floor(bill / 100);
        log("Sending Tx rewardCustomer(" + addr + ", " + pts + ")...");
        const tx = await contract.rewardCustomer(addr, pts);
        log("Tx Hash: " + tx.hash + ". Mining...");
        await tx.wait();
        log("🎉 Mint Confirmed!");
        checkBal();
    }
</script>
</body>
</html>
